name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # BF_SERVER_SBA_TEMPLATES_IN_CI_v2 - `secrets` cannot be referenced from
      # an `if:` expression; `env` can. Unset resolves to an empty string.
      SBA_TEMPLATES_TARBALL_B64: ${{ secrets.SBA_TEMPLATES_TARBALL_B64 }}

    steps:
      - uses: actions/checkout@v5

      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"

      - name: Install deps
        run: npm install --include=optional

      - name: Build
        run: npm run build

      # BF_SERVER_SPLIT_INTEGRATION_TESTS_v1
      # This step used to be a no-op that echoed a skip message, under the
      # heading "no test suite yet". There are 885 tests. Nothing had run them
      # in CI for a long time, so no regression could ever be caught here -
      # every block had to carry its own gate. Tests needing live
      # infrastructure are excluded by vitest.config.ts and run separately
      # via `npm run test:integration`.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:ci

      # BF_SERVER_SBA_TEMPLATES_IN_CI_v1
      # The three official SBA PDFs are not in the repo and must not be. They
      # arrive as a base64 tar in SBA_TEMPLATES_TARBALL_B64 so the only tests
      # that verify a value reaches the page can run. Without the secret this
      # step is a no-op and the tests skip exactly as they do today.
      - name: SBA real-template fill
        if: env.SBA_TEMPLATES_TARBALL_B64 != ''
        env:
          SBA_TEMPLATES_TARBALL_B64: ${{ secrets.SBA_TEMPLATES_TARBALL_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sba-templates"
          echo "$SBA_TEMPLATES_TARBALL_B64" | base64 -d > "$RUNNER_TEMP/sba.tar.gz"
          tar -xzf "$RUNNER_TEMP/sba.tar.gz" -C "$RUNNER_TEMP/sba-templates"
          for f in sba-form-1919-02-2025.pdf sba-form-413-05-2024.pdf sba-form-912-12-2028.pdf; do
            test -f "$RUNNER_TEMP/sba-templates/$f" || { echo "missing template: $f"; exit 1; }
          done
          SBA_TEMPLATE_DIR="$RUNNER_TEMP/sba-templates" \
            npx vitest run src/signnow/sba/__tests__/sbaRealTemplateFill.v130.test.ts --reporter=verbose

  # BF_SERVER_INTEGRATION_IN_CI_v1
  # 44 files / 70 tests were excluded from the unit run because they need a
  # reachable Postgres, and then nothing ever ran them. Separate job so a
  # database flake cannot redden the unit gate.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"

      - name: Install deps
        run: npm install --include=optional

      # BF_SERVER_INTEGRATION_MIGRATIONS_v1
      # The service container starts empty. src/startup/runMigrations.ts is what
      # builds the schema on boot; run it here so the suite meets a real
      # database rather than an empty one.
      - name: Apply migrations to the test database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/bf_test
          NODE_ENV: test
        run: npx tsx -e "import('./src/db.js').then(async ({ pool }) => { try { const { runMigrations } = await import('./src/startup/runMigrations.js'); await runMigrations(pool); console.log('migrations applied'); } finally { await pool.end(); } })"

      - name: Integration tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/bf_test
          JWT_SECRET: ci-integration-secret-min-10
          NODE_ENV: test
        # These have not run in a long time. Report the result without
        # blocking merges until the standing failures are burned down; flip
        # continue-on-error off once it is green.
        continue-on-error: true
        run: npm run test:integration
