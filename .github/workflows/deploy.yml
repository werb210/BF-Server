name: Build and deploy Node.js app to Azure Web App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      SCM_DO_BUILD_DURING_DEPLOYMENT: false
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v5

      - name: Use Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - name: Install deps
        # BF_SERVER_DEPLOY_NPM_CI_v163 - was: rm -rf node_modules package-lock.json
        # && npm install. Deleting the committed lockfile forced a from-scratch
        # resolve that crashes arborist ("Cannot read properties of null (reading
        # 'edgesOut')") on the vitest 4.x peer graph. npm ci installs
        # deterministically from the committed lock and never hits that path.
        run: npm ci --include=optional

      - name: Clean build artifacts
        run: rm -rf dist

      - name: Build
        run: npm run build

      - name: Prune dev deps
        run: npm prune --omit=dev

      - name: Verify build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node scripts/verify-build.js
          node -e "require('./dist/routes'); require('./dist/routes/auth'); require('./dist/config/env');"

      - name: Create deployment package
        run: |
          zip -r release.zip . \
            -x "*.git*" \
               "node_modules/.cache/*" \
               "src/*" \
               "test/*" \
               ".github/*" \
               ".env"

      # 🔴 THIS IS THE FIX
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: boreal-staff-server
          slot-name: staging
          package: release.zip
